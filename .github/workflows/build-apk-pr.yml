name: Build Tested Android APK (PR)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_VERSION: "8.0.1"

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Verify uploaded Android project bundle
        run: test -s android-project-bundle.zip

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q android-project-bundle.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/res/raw/cma_simulator.zip
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("project/app/build.gradle")
          text = path.read_text(encoding="utf-8")
          text, code_count = re.subn(r"versionCode\s*(?:=\s*)?\d+", "versionCode 801", text, count=1)
          text, name_count = re.subn(r"versionName\s*(?:=\s*)?[\"'][^\"']+[\"']", 'versionName "8.0.1"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit(f"Could not update Android version: versionCode={code_count}, versionName={name_count}")
          path.write_text(text, encoding="utf-8")
          PY
          grep -Eq 'versionCode[[:space:]]*(=[[:space:]]*)?801' project/app/build.gradle
          grep -Eq 'versionName[[:space:]]*(=[[:space:]]*)?"8\.0\.1"' project/app/build.gradle

      - name: Apply private-safe V8 web upgrade
        run: |
          set -euo pipefail
          rm -rf project/v8-web
          mkdir -p project/v8-web
          unzip -q project/app/src/main/res/raw/cma_simulator.zip -d project/v8-web
          python3 v8-overlay/apply-v8-patches.py project/v8-web v8-overlay
          node --check v8-overlay/cma-v8-core.js
          node --check v8-overlay/cma-v8.js
          node v8-tests/test-v8-core.js
          python3 v8-tests/validate-v8-runtime.py project/v8-web
          if [ -f project/v8-web/package.json ]; then
            (cd project/v8-web && npm test)
          fi
          rm project/app/src/main/res/raw/cma_simulator.zip
          (cd project/v8-web && zip -qr ../app/src/main/res/raw/cma_simulator.zip .)
          unzip -t project/app/src/main/res/raw/cma_simulator.zip

      - name: Align smoke test with current app title
        run: sed -i 's/US CMA Part 2 Exam Simulator/CMA Exam Simulator/g' project/app/src/androidTest/java/com/cmaexamsimulator/mobile/AppLaunchTest.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Run JVM tests and build APK
        working-directory: project
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Verify APK and embedded V8 simulator
        run: |
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee project/app/build/apk-badging.txt
          grep -q "package: name='com.cmaexamsimulator.mobile'" project/app/build/apk-badging.txt
          grep -q "versionCode='801'" project/app/build/apk-badging.txt
          grep -q "versionName='8.0.1'" project/app/build/apk-badging.txt
          unzip -l "$APK" | tee project/app/build/apk-files.txt
          grep -q 'res/raw/cma_simulator.zip' project/app/build/apk-files.txt
          unzip -p "$APK" res/raw/cma_simulator.zip > project/app/build/embedded-web.zip
          unzip -t project/app/build/embedded-web.zip
          for required in index.html hock-2024-2025-catalog.json cma-v2.js cma-v8-core.js cma-v8.js cma-v8.css android-app.js; do
            unzip -l project/app/build/embedded-web.zip | grep -q "$required"
          done
          if unzip -l project/app/build/embedded-web.zip | grep -Ei '\.(pdf|PDF)$'; then
            echo "A PDF was incorrectly included in the public APK" >&2
            exit 1
          fi
          cp "$APK" US-CMA-Exam-Simulator-v8.0.1.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android WebView smoke tests
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: Nexus 6
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: true
          script: bash -lc 'cd project && set -o pipefail && gradle --no-daemon connectedDebugAndroidTest --stacktrace --info 2>&1 | tee app/build/emulator-test.log'

      - name: Upload compiled and structurally verified APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: US-CMA-Exam-Simulator-v8.0.1-APK
          path: US-CMA-Exam-Simulator-v8.0.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-v8.0.1-test-diagnostics
          path: |
            project/app/build/emulator-test.log
            project/app/build/reports/
            project/app/build/outputs/androidTest-results/
            project/app/build/apk-badging.txt
            project/app/build/apk-files.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Require emulator smoke-test success
        if: steps.smoke.outcome != 'success'
        run: exit 1
